<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha — Portal Gestor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2.5rem; border-radius: 16px; border: 1px solid #e4e7ec; max-width: 360px; box-sizing: border-box; width: 100%; }
        h1 { font-size: 1.25rem; color: #101828; margin-bottom: 1rem; }
        p { font-size: 0.875rem; color: #344054; }
        input { width: 100%; padding: 0.6rem 0.75rem; margin-bottom: 1rem; border: 1px solid #e4e7ec; border-radius: 8px; box-sizing: border-box; font-size: 0.875rem; }
        button { width: 100%; padding: 0.7rem; background: #465fff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; }
        button:hover { background: #3641f5; }
    </style>
</head>
<body>
    <div class="card">
        {% if validlink %}
            <h1>Defina uma nova senha</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Salvar nova senha</button>
            </form>
        {% else %}
            <h1>Link inválido</h1>
            <p>O link de redefinição é inválido, já foi usado ou expirou.
            Solicite um novo link.</p>
        {% endif %}
    </div>
</body>
</html>
