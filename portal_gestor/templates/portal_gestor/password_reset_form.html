<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Portal Gestor</title>
    <style>
        :root { --color-brand-500: #465fff; --color-brand-600: #3641f5; --color-gray-50: #f9fafb; --color-gray-200: #e4e7ec; --color-gray-700: #344054; --color-gray-900: #101828; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--color-gray-50); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2.5rem; border-radius: 16px; border: 1px solid var(--color-gray-200); box-shadow: 0px 1px 3px 0px rgba(16, 24, 40, 0.1), 0px 1px 2px 0px rgba(16, 24, 40, 0.06); width: 100%; max-width: 360px; box-sizing: border-box; }
        h1 { font-size: 1.25rem; margin-bottom: 1rem; color: var(--color-gray-900); }
        p { font-size: 0.875rem; color: var(--color-gray-700); }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; color: var(--color-gray-700); }
        input { width: 100%; padding: 0.6rem 0.75rem; margin-bottom: 1rem; border: 1px solid var(--color-gray-200); border-radius: 8px; box-sizing: border-box; font-size: 0.875rem; }
        button { width: 100%; padding: 0.7rem; background: var(--color-brand-500); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; }
        button:hover { background: var(--color-brand-600); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Redefinir senha</h1>
        <p>Informe o e-mail cadastrado no Portal Gestor. Se existir uma conta
        com esse e-mail, enviaremos um link para redefinir a senha.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enviar link de redefinição</button>
        </form>
    </div>
</body>
</html>
