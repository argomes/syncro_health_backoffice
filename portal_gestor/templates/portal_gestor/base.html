<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal Gestor{% endblock %} — Syncro Health</title>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <style>
        /* Tokens de cor extraídos do template TailAdmin (HTML/Tailwind) —
           só a paleta e o padrão de card/badge, sem adotar a densidade nem a
           sidebar do template (avaliação da PO Healthtech, 2026-07-13). */
        :root {
            --color-brand-50: #ecf3ff;
            --color-brand-500: #465fff;
            --color-brand-600: #3641f5;
            --color-success-50: #ecfdf3;
            --color-success-500: #12b76a;
            --color-success-600: #039855;
            --color-error-50: #fef3f2;
            --color-error-500: #f04438;
            --color-error-600: #d92d20;
            --color-warning-50: #fffaeb;
            --color-warning-500: #f79009;
            --color-warning-600: #dc6803;
            --color-gray-50: #f9fafb;
            --color-gray-100: #f2f4f7;
            --color-gray-200: #e4e7ec;
            --color-gray-400: #98a2b3;
            --color-gray-500: #667085;
            --color-gray-700: #344054;
            --color-gray-800: #1d2939;
            --color-gray-900: #101828;
            --shadow-card: 0px 1px 3px 0px rgba(16, 24, 40, 0.1), 0px 1px 2px 0px rgba(16, 24, 40, 0.06);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--color-gray-50);
            margin: 0;
            color: var(--color-gray-900);
        }
        header {
            background: #fff;
            border-bottom: 1px solid var(--color-gray-200);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header .brand { font-weight: 600; color: inherit; text-decoration: none; }
        header .brand:hover { color: var(--color-brand-600); }
        header .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--color-gray-500);
        }
        header form { margin: 0; }
        header button {
            background: none;
            border: 1px solid var(--color-gray-200);
            border-radius: 8px;
            padding: 0.35rem 0.75rem;
            cursor: pointer;
            font-size: 0.8125rem;
            color: var(--color-gray-700);
        }
        header button:hover { background: var(--color-gray-100); }
        main {
            max-width: 960px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }
        h1 { font-size: 1.25rem; color: var(--color-gray-900); }
        h2 { font-size: 1rem; color: var(--color-gray-900); }
        .muted { color: var(--color-gray-500); font-size: 0.875rem; }
        .error {
            background: var(--color-error-50);
            color: var(--color-error-600);
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .info {
            background: var(--color-brand-50);
            color: var(--color-brand-600);
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
        .button {
            display: inline-block;
            background: var(--color-brand-500);
            color: #fff;
            text-decoration: none;
            border: none;
            padding: 0.6rem 1.1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }
        .button:hover { background: var(--color-brand-600); }

        /* Card — rounded-2xl (16px) + border sutil + sombra leve, padrão TailAdmin */
        .card {
            background: #fff;
            border: 1px solid var(--color-gray-200);
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: var(--shadow-card);
        }
        .card p { margin: 0.5rem 0; font-size: 0.875rem; color: var(--color-gray-700); }

        /* Badge — pill com fundo claro + texto escuro da mesma família (padrão TailAdmin) */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.15rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-green, .badge-ready { background: var(--color-success-50); color: var(--color-success-600); }
        .badge-yellow, .badge-pending, .badge-key_delivered, .badge-syncing {
            background: var(--color-warning-50); color: var(--color-warning-600);
        }
        .badge-red, .badge-expired { background: var(--color-error-50); color: var(--color-error-600); }
        .badge-gray { background: var(--color-gray-100); color: var(--color-gray-700); }

        .report-form label { display: block; font-size: 0.875rem; margin: 0.75rem 0 0.25rem; color: var(--color-gray-700); }
        .report-form input[type="date"] {
            padding: 0.5rem 0.65rem; border: 1px solid var(--color-gray-200); border-radius: 8px; font-size: 0.875rem;
        }
        .report-form fieldset { border: 1px solid var(--color-gray-200); border-radius: 8px; margin: 1rem 0; padding: 0.75rem 1rem; }
        .report-form .checkbox-label { display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 1.5rem; font-weight: normal; }

        table.data-table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.8125rem; }
        table.data-table th, table.data-table td { border: 1px solid var(--color-gray-200); padding: 0.6rem 0.7rem; text-align: left; }
        table.data-table th { background: var(--color-gray-50); color: var(--color-gray-700); font-weight: 600; }

        /* Aviso contextual dispensável (TASK-051) — só ocupa espaço quando existe. */
        .notice-banner {
            background: var(--color-brand-50);
            border: 1px solid var(--color-brand-500);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin: 1rem 1.5rem 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.875rem;
        }
        .notice-banner-text strong { color: var(--color-gray-900); margin-right: 0.5rem; }
        .notice-banner-text span { color: var(--color-gray-700); }
        .notice-banner-dismiss {
            background: none;
            border: 1px solid var(--color-brand-500);
            color: var(--color-brand-600);
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .notice-banner-dismiss:hover { background: var(--color-brand-500); color: #fff; }

        /* Navegação de nível 1 (TASK-052 — estrutura de menu proposta pela PO,
           2026-07-14): faixa fina abaixo do header, só com os 2 itens que
           existem hoje. Nas telas de sub-fluxo (relatório), o mesmo espaço
           vira breadcrumb — nunca os dois empilhados. */
        .portal-nav {
            background: #fff;
            border-bottom: 1px solid var(--color-gray-200);
            padding: 0 1.5rem;
            display: flex;
            gap: 1.5rem;
        }
        .portal-nav a {
            display: inline-block;
            padding: 0.7rem 0.1rem;
            color: var(--color-gray-500);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }
        .portal-nav a:hover { color: var(--color-gray-900); }
        .portal-nav a.active { color: var(--color-brand-600); border-bottom-color: var(--color-brand-500); }

        .portal-breadcrumb {
            background: #fff;
            border-bottom: 1px solid var(--color-gray-200);
            padding: 0.7rem 1.5rem;
            font-size: 0.8125rem;
            color: var(--color-gray-500);
        }
        .portal-breadcrumb a { color: var(--color-gray-500); text-decoration: none; }
        .portal-breadcrumb a:hover { color: var(--color-brand-600); text-decoration: underline; }
        .portal-breadcrumb .current { color: var(--color-gray-900); font-weight: 500; }
        .portal-breadcrumb .sep { margin: 0 0.4rem; color: var(--color-gray-400); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <a class="brand" href="{% url 'portal_home' %}">Portal Gestor — {{ request.clinic.name }}</a>
        <div class="user-info">
            <span>{{ request.clinic_user.email }}</span>
            <form method="post" action="{% url 'portal_logout' %}">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        </div>
    </header>
    {% block subnav %}
        <nav class="portal-nav">
            <a href="{% url 'portal_home' %}" class="{% if request.resolver_match.url_name == 'portal_home' %}active{% endif %}">Dashboard</a>
            <a href="{% url 'portal_report_new' %}" class="{% if 'report' in request.resolver_match.url_name %}active{% endif %}">Relatórios</a>
        </nav>
    {% endblock %}
    {% include "portal_gestor/_notice_banner.html" %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
