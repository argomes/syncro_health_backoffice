<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link enviado — Portal Gestor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9fafb; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2.5rem; border-radius: 16px; border: 1px solid #e4e7ec; max-width: 360px; }
        h1 { font-size: 1.25rem; color: #101828; }
        p { font-size: 0.875rem; color: #344054; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Verifique seu e-mail</h1>
        <p>Se existir uma conta no Portal Gestor com o e-mail informado,
        enviamos um link para redefinir a senha. O link expira em algumas
        horas.</p>
    </div>
</body>
</html>
