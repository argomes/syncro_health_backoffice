{% extends "portal_gestor/base.html" %}
{% block title %}Início{% endblock %}
{% block extra_head %}
<style>
    #dashboard-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
    }
    .card h2 { margin-top: 0; }
    .report-list { list-style: none; padding: 0; margin: 0.5rem 0 0; font-size: 0.8125rem; }
    .report-list li { padding: 0.35rem 0; border-top: 1px solid var(--color-gray-200); }
    .report-list a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .report-list a:hover { color: var(--color-brand-500); }
</style>
{% endblock %}
{% block content %}
    {% include "portal_gestor/_dashboard_cards.html" %}
{% endblock %}
