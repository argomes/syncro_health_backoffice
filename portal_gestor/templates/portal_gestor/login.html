<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Gestor — Syncro Health</title>
    <style>
        :root {
            --color-brand-500: #465fff;
            --color-brand-600: #3641f5;
            --color-error-50: #fef3f2;
            --color-error-600: #d92d20;
            --color-gray-50: #f9fafb;
            --color-gray-200: #e4e7ec;
            --color-gray-700: #344054;
            --color-gray-900: #101828;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--color-gray-50);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid var(--color-gray-200);
            box-shadow: 0px 1px 3px 0px rgba(16, 24, 40, 0.1), 0px 1px 2px 0px rgba(16, 24, 40, 0.06);
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.25rem; margin-bottom: 1.5rem; color: var(--color-gray-900); }
        label { display: block; font-size: 0.875rem; margin-bottom: 0.25rem; color: var(--color-gray-700); }
        input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid var(--color-gray-200);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.875rem;
        }
        input:focus { outline: 2px solid var(--color-brand-500); outline-offset: 1px; }
        button {
            width: 100%;
            padding: 0.7rem;
            background: var(--color-brand-500);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
        }
        button:hover { background: var(--color-brand-600); }
        .error {
            background: var(--color-error-50);
            color: var(--color-error-600);
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Portal Gestor</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autofocus>
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
