<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redefinir senha — Backoffice Syncro Health</title>
</head>
<body>
    <h1>Redefinir senha</h1>
    <p>Informe o e-mail da sua conta de suporte. Se existir uma conta com esse
    e-mail, enviaremos um link para redefinir a senha.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar link de redefinição</button>
    </form>
</body>
</html>
