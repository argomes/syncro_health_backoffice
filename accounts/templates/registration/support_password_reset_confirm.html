<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova senha — Backoffice Syncro Health</title>
</head>
<body>
    {% if validlink %}
        <h1>Defina uma nova senha</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Salvar nova senha</button>
        </form>
    {% else %}
        <h1>Link inválido</h1>
        <p>O link de redefinição é inválido, já foi usado ou expirou.
        Solicite um novo link.</p>
    {% endif %}
</body>
</html>
