name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db_test.sqlite3
      # Não é usado de fato (nenhum Postgres real sobe neste job) — só
      # precisa ser uma URL sintaticamente válida. clinics/provisioning.py
      # exige a env var configurada mesmo nos testes que exercitam o
      # caminho de falha de conexão (OperationalError), e falha antes disso
      # com RuntimeError se estiver ausente.
      PROVISIONING_DATABASE_URL: postgres://superuser:senha@localhost:5432/postgres
      CLINIC_DB_TEMPLATE: clinic_schema_template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit dependencies (pip-audit)
        # Bloqueante: qualquer vulnerabilidade conhecida em requirements.txt
        # falha o pipeline, mesmo padrão de rigor do govulncheck no gateway
        # (syncro_gateway/ci.yml) — sem continue-on-error.
        run: pip-audit -r requirements.txt
