# TASK-053 — infra de homologação local (Postgres + Redis via Docker).
#
# Uso:
#   docker compose up -d        # sobe os dois serviços
#   docker compose down         # derruba (mantém dados no volume)
#   docker compose down -v      # derruba e apaga os dados (recomeça do zero,
#                                # reaplica o schema de template no próximo up)
#
# Pressupõe que o monorepo syncro_gateway está clonado como repositório irmão
# deste (../SyncroHealth/syncro_gateway) — é de onde o schema do Postgres
# (patients/appointments/dual envelope) é lido para montar o banco de template
# usado no provisionamento de clínicas (ver docker/postgres-init/01-clinic-template.sh
# e clinics/provisioning.py::CLINIC_DB_TEMPLATE).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: superuser
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - syncro_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ../SyncroHealth/syncro_gateway/internal/adapters/output/cloud/migrations:/gateway-migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superuser"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncro_postgres_data:
